<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Свет → Электричество · Как работает солнечная электростанция</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
:root{
  --sun:#ffb340; --sun2:#ff7a1a; --el:#3cc8ff; --hole:#ff5c8a; --field:#a970ff; --ok:#4cffb0;
  --txt:#eef2ff; --mut:rgba(220,228,255,.62); --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09);
  --line:rgba(255,255,255,.14); --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100vw;height:100vh;overflow:hidden;background:#03040b;color:var(--txt);font-family:var(--font);-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none;touch-action:none}
#bg{position:fixed;inset:0;width:100vw;height:100vh;z-index:0}
#app{position:fixed;inset:0;z-index:1}
/* ---------- top bar ---------- */
.topbar{position:absolute;top:0;left:0;right:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(14px,2.4vw,36px);z-index:20;pointer-events:none}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;letter-spacing:.2px;font-size:15px;pointer-events:auto}
.brand .logo{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff6d0,var(--sun) 40%,var(--sun2) 75%);box-shadow:0 0 22px rgba(255,170,60,.75),0 0 60px rgba(255,140,40,.35);animation:pulse 4s ease-in-out infinite}
.brand small{color:var(--mut);font-weight:500}
@keyframes pulse{50%{box-shadow:0 0 30px rgba(255,170,60,.95),0 0 90px rgba(255,140,40,.45)}}
.tools{display:flex;gap:8px;pointer-events:auto}
.icon-btn{height:38px;min-width:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--txt);display:flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;font:500 13px var(--font);transition:transform .35s var(--spring),background .3s,border-color .3s,box-shadow .3s}
.icon-btn:hover{background:var(--glass2);transform:translateY(-1px) scale(1.04);border-color:rgba(255,255,255,.28)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.on{border-color:rgba(255,179,64,.65);box-shadow:0 0 18px rgba(255,179,64,.35);background:rgba(255,179,64,.14)}
.icon-btn svg{width:17px;height:17px}
.icon-btn .lbl{display:inline}
/* ---------- stage ---------- */
#stage{position:absolute;inset:0;perspective:1600px}
.scene{position:absolute;inset:0;padding:74px clamp(14px,2.4vw,36px) 92px;opacity:0;visibility:hidden;pointer-events:none;transform:translate3d(0,0,0);transition:opacity .9s var(--ease),transform 1.1s var(--ease),filter .9s var(--ease),visibility 0s linear 1.1s}
.scene.active{opacity:1;visibility:visible;pointer-events:auto;transform:none;filter:none;transition:opacity .9s var(--ease) .12s,transform 1.1s var(--ease) .05s,filter .9s var(--ease) .12s,visibility 0s}
.scene.from-right{transform:translate3d(9%,0,-260px) rotateY(-9deg);filter:blur(14px)}
.scene.from-left{transform:translate3d(-9%,0,-260px) rotateY(9deg);filter:blur(14px)}
.scene.to-left{transform:translate3d(-7%,0,-320px) rotateY(8deg) scale(.96);filter:blur(16px);opacity:0}
.scene.to-right{transform:translate3d(7%,0,-320px) rotateY(-8deg) scale(.96);filter:blur(16px);opacity:0}
.grid{width:100%;height:100%;display:grid;grid-template-columns:minmax(300px,31%) 1fr;gap:clamp(12px,1.6vw,24px)}
.grid.wide{grid-template-columns:minmax(300px,27%) 1fr}
.glass{background:linear-gradient(160deg,rgba(255,255,255,.085),rgba(255,255,255,.03));border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);box-shadow:0 24px 70px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12)}
.info{padding:clamp(16px,2vw,30px);display:flex;flex-direction:column;gap:14px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.2) transparent;touch-action:pan-y}
.info::-webkit-scrollbar{width:5px}.info::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:3px}
.kicker{font-size:12px;letter-spacing:2.2px;text-transform:uppercase;color:var(--sun);font-weight:600;display:flex;align-items:center;gap:10px}
.kicker:before{content:"";width:22px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--sun),transparent)}
.info h1{font-size:clamp(24px,2.6vw,42px);line-height:1.06;font-weight:700;letter-spacing:-.8px}
.info h1 .g{background:linear-gradient(92deg,#fff3c4,var(--sun) 45%,var(--sun2));-webkit-background-clip:text;background-clip:text;color:transparent}
.info h1 .b{background:linear-gradient(92deg,#d7f5ff,var(--el));-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{font-size:clamp(13.5px,1.05vw,16.5px);line-height:1.5;color:var(--mut)}
.lead b,.pts b{color:var(--txt);font-weight:600}
.pts{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:clamp(12.5px,.95vw,14.5px);line-height:1.45;color:rgba(230,236,255,.82)}
.pts li{position:relative;padding-left:20px}
.pts li:before{content:"";position:absolute;left:3px;top:.55em;width:7px;height:7px;border-radius:50%;background:var(--sun);box-shadow:0 0 10px var(--sun)}
.pts li.e:before{background:var(--el);box-shadow:0 0 10px var(--el)}
.pts li.h:before{background:var(--hole);box-shadow:0 0 10px var(--hole)}
.pts li.f:before{background:var(--field);box-shadow:0 0 10px var(--field)}
.e-t{color:var(--el)}.h-t{color:var(--hole)}.f-t{color:var(--field)}.s-t{color:var(--sun)}
.controls{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.visual{position:relative;border-radius:28px;overflow:hidden;min-height:0;min-width:0;border:1px solid rgba(255,255,255,.08);background:radial-gradient(120% 90% at 50% 0%,rgba(80,90,170,.16),rgba(5,7,20,.35) 60%);box-shadow:inset 0 0 120px rgba(0,0,0,.45)}
.visual canvas{position:absolute;inset:0;display:block}
.visual.drag{cursor:grab}.visual.drag:active{cursor:grabbing}
.cap{position:absolute;left:18px;bottom:16px;max-width:calc(100% - 36px);padding:9px 14px;border-radius:14px;font-size:12.5px;color:rgba(235,240,255,.88);background:rgba(10,12,30,.55);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);pointer-events:none;z-index:3}
.cap b{color:var(--sun)}
.hud{position:absolute;z-index:4;display:flex;gap:10px;flex-wrap:wrap;pointer-events:none}
.hud.tl{top:16px;left:16px}.hud.tr{top:16px;right:16px;justify-content:flex-end}.hud.br{right:16px;bottom:16px}.hud.bl{left:16px;bottom:16px}
.stat{padding:10px 15px;border-radius:16px;background:rgba(12,14,34,.55);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);min-width:96px}
.stat .k{font-size:10.5px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)}
.stat .v{font-size:clamp(17px,1.6vw,26px);font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:2px}
.stat .v small{font-size:.55em;font-weight:600;color:var(--mut);margin-left:3px}
.stat.sun .v{color:var(--sun)}.stat.el .v{color:var(--el)}.stat.ho .v{color:var(--hole)}.stat.fi .v{color:var(--field)}.stat.ok .v{color:var(--ok)}
.chip{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-size:12.5px;color:var(--txt);transition:transform .35s var(--spring),border-color .3s,background .3s,box-shadow .3s;cursor:default;position:relative}
.chip:hover{transform:translateY(-2px) scale(1.05);border-color:rgba(255,179,64,.6);background:rgba(255,179,64,.1);box-shadow:0 6px 24px rgba(255,179,64,.2)}
.chip i{font-style:normal;color:var(--mut);font-size:11px}
.formula{font:600 clamp(13px,1vw,15.5px) ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:12px 14px;border-radius:14px;background:rgba(169,112,255,.09);border:1px solid rgba(169,112,255,.3);color:#e9ddff;letter-spacing:.2px;line-height:1.5}
.formula .s-t{color:var(--sun)}
.callout{padding:12px 14px;border-radius:16px;font-size:13px;line-height:1.45;background:linear-gradient(120deg,rgba(255,179,64,.13),rgba(255,92,138,.08));border:1px solid rgba(255,179,64,.33)}
.callout.blue{background:linear-gradient(120deg,rgba(60,200,255,.12),rgba(169,112,255,.08));border-color:rgba(60,200,255,.33)}
.tag{font-size:clamp(28px,4.4vw,72px);font-weight:800;letter-spacing:-1.5px;line-height:1}
/* ---------- custom controls ---------- */
.ctl{display:flex;flex-direction:column;gap:7px}
.ctl-h{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--mut)}
.ctl-h .val{color:var(--txt);font-weight:600;font-variant-numeric:tabular-nums;transition:color .3s}
.slider{position:relative;height:30px;cursor:pointer;touch-action:none}
.slider .tr{position:absolute;left:0;right:0;top:50%;height:7px;margin-top:-3.5px;border-radius:7px;background:rgba(255,255,255,.1);box-shadow:inset 0 1px 2px rgba(0,0,0,.5);overflow:hidden}
.slider .fi{position:absolute;left:0;top:0;bottom:0;border-radius:7px;background:linear-gradient(90deg,var(--c1,#ff9a2e),var(--c2,#ffd36b));box-shadow:0 0 14px var(--c2,#ffd36b)}
.slider .th{position:absolute;top:50%;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#e8ecff 60%,#c9d0ea);box-shadow:0 3px 10px rgba(0,0,0,.5),0 0 0 0 rgba(255,200,100,0);transition:transform .35s var(--spring),box-shadow .3s}
.slider:hover .th{transform:scale(1.1);box-shadow:0 3px 10px rgba(0,0,0,.5),0 0 0 6px rgba(255,255,255,.08)}
.slider.act .th{transform:scale(1.28);box-shadow:0 3px 14px rgba(0,0,0,.5),0 0 0 9px rgba(255,200,110,.16),0 0 22px var(--c2,#ffd36b)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;font-size:13.5px;padding:3px 0}
.sw .knob{flex:none;position:relative;width:52px;height:31px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.12);transition:background .35s var(--ease),box-shadow .35s}
.sw .knob:after{content:"";position:absolute;top:2px;left:2px;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.4);transition:transform .45s var(--spring),width .25s}
.sw:active .knob:after{width:31px}
.sw.on .knob{background:linear-gradient(90deg,#ff9a2e,#ffc94d);box-shadow:0 0 18px rgba(255,170,60,.55)}
.sw.on .knob:after{transform:translateX(21px)}
.sw.on:active .knob:after{transform:translateX(15px)}
.sw.blue.on .knob{background:linear-gradient(90deg,#2a8cff,#3cc8ff);box-shadow:0 0 18px rgba(60,200,255,.55)}
.seg{position:relative;display:flex;padding:4px;border-radius:15px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1)}
.seg .pill{position:absolute;top:4px;bottom:4px;border-radius:11px;background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,.14));box-shadow:0 4px 14px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3);transition:left .5s var(--spring),width .5s var(--spring)}
.seg button{position:relative;flex:1;z-index:1;border:0;background:none;color:var(--mut);font:600 12.5px var(--font);padding:9px 8px;cursor:pointer;border-radius:11px;transition:color .3s;white-space:nowrap}
.seg button.sel{color:#fff}
.btn{position:relative;border:1px solid rgba(255,255,255,.18);background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));color:var(--txt);font:600 13.5px var(--font);padding:11px 18px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:transform .4s var(--spring),box-shadow .3s,border-color .3s,background .3s;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.1);border-color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(180deg,#ffbe55,#ff8a24);border-color:rgba(255,220,150,.6);color:#2a1300;box-shadow:0 8px 28px rgba(255,140,40,.35)}
.btn.blu{background:linear-gradient(180deg,#5fd6ff,#2a8cff);border-color:rgba(160,230,255,.6);color:#001a33;box-shadow:0 8px 28px rgba(60,170,255,.35)}
.btn.pnk{background:linear-gradient(180deg,#ff86a8,#ff4d7d);border-color:rgba(255,190,210,.6);color:#33000f;box-shadow:0 8px 28px rgba(255,80,130,.3)}
.btn .rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}
/* ---------- reveal ---------- */
.rv{opacity:0;transform:translateY(18px);transition:opacity .8s var(--ease),transform .9s var(--ease)}
.scene.active .rv{opacity:1;transform:none}
.scene.active .rv:nth-child(1){transition-delay:.25s}.scene.active .rv:nth-child(2){transition-delay:.33s}.scene.active .rv:nth-child(3){transition-delay:.41s}.scene.active .rv:nth-child(4){transition-delay:.49s}.scene.active .rv:nth-child(5){transition-delay:.57s}.scene.active .rv:nth-child(6){transition-delay:.65s}.scene.active .rv:nth-child(7){transition-delay:.73s}.scene.active .rv:nth-child(8){transition-delay:.81s}.scene.active .rv:nth-child(n+9){transition-delay:.89s}
/* ---------- timeline ---------- */
#nav{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:24px;max-width:calc(100vw - 24px)}
#nav .arrow{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.05);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .35s var(--spring),background .3s;flex:none}
#nav .arrow:hover{background:rgba(255,255,255,.14);transform:scale(1.08)}#nav .arrow:active{transform:scale(.9)}
#dots{display:flex;align-items:center;gap:4px;position:relative}
.dot{position:relative;height:38px;min-width:26px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:12px;padding:0 6px;transition:background .3s}
.dot span{display:block;width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:all .5s var(--spring)}
.dot:hover span{background:rgba(255,255,255,.7);transform:scale(1.3)}
.dot.done span{background:rgba(255,179,64,.55)}
.dot.cur span{width:26px;border-radius:5px;background:linear-gradient(90deg,var(--sun),#ffe08a);box-shadow:0 0 14px var(--sun)}
.dot em{position:absolute;bottom:46px;left:50%;transform:translate(-50%,6px);white-space:nowrap;font-style:normal;font-size:12px;padding:6px 10px;border-radius:10px;background:rgba(14,16,36,.85);border:1px solid var(--line);opacity:0;pointer-events:none;transition:all .3s var(--ease)}
.dot:hover em{opacity:1;transform:translate(-50%,0)}
#counter{font:600 13px var(--font);font-variant-numeric:tabular-nums;color:var(--mut);padding:0 8px;white-space:nowrap}
#counter b{color:#fff}
#secname{font-size:12.5px;color:var(--txt);padding-right:6px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
#progress{position:absolute;left:0;top:0;height:2px;background:linear-gradient(90deg,var(--sun),var(--el));box-shadow:0 0 10px var(--sun);z-index:30;transition:width .9s var(--ease)}
/* ---------- notes ---------- */
#notes{position:absolute;right:clamp(10px,2vw,28px);top:72px;bottom:90px;width:min(440px,calc(100vw - 20px));z-index:25;padding:22px 24px;display:flex;flex-direction:column;gap:12px;transform:translateX(calc(100% + 40px));opacity:0;transition:transform .7s var(--spring),opacity .4s}
#notes.open{transform:none;opacity:1}
#notes h3{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--sun);display:flex;justify-content:space-between;align-items:center}
#notes .txt{overflow-y:auto;font-size:15.5px;line-height:1.62;color:#f2f4ff;padding-right:6px;touch-action:pan-y}
#notes .txt p{margin-bottom:.8em}
#notes .fix{font-size:12px;color:var(--mut);border-top:1px solid var(--line);padding-top:10px;line-height:1.5}
#toast{position:absolute;left:50%;top:76px;transform:translate(-50%,-20px);z-index:40;padding:10px 18px;border-radius:14px;font-size:13px;opacity:0;transition:all .5s var(--spring);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
#hint{position:absolute;right:20px;bottom:24px;font-size:11.5px;color:rgba(220,228,255,.4);z-index:19;pointer-events:none}
.tip{position:absolute;z-index:6;pointer-events:none;padding:9px 13px;border-radius:12px;background:rgba(12,14,34,.82);border:1px solid rgba(255,179,64,.45);font-size:12.5px;line-height:1.4;opacity:0;transform:translateY(6px);transition:opacity .25s,transform .25s;max-width:240px}
.tip.show{opacity:1;transform:none}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chain .st{padding:8px 12px;border-radius:12px;font-size:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--mut);transition:all .5s var(--spring)}
.chain .st.lit{color:#1f1200;background:linear-gradient(180deg,#ffd27a,#ff9a2e);border-color:#ffd27a;box-shadow:0 0 22px rgba(255,170,60,.6);transform:translateY(-2px) scale(1.06)}
.chain .st.past{color:var(--txt);border-color:rgba(255,179,64,.5);background:rgba(255,179,64,.1)}
.chain .ar{color:rgba(255,255,255,.3);font-size:12px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
#stage .mini{gap:6px}.mini .stat{min-width:0;flex:1;padding:7px 9px;border-radius:12px}.mini .stat .v{font-size:16px}.mini .stat .k{font-size:9.5px;letter-spacing:.6px}
.homes{display:flex;flex-wrap:wrap;gap:3px;max-width:230px;margin-top:6px}
.homes svg{width:15px;height:15px;transition:all .4s}
/* ---------- responsive ---------- */
@media (max-aspect-ratio:4/3){.grid,.grid.wide{grid-template-columns:minmax(270px,36%) 1fr}#secname{display:none}}
@media (max-width:860px),(max-aspect-ratio:1/1){
  .scene{padding:62px 10px 78px}
  .grid,.grid.wide{grid-template-columns:1fr;grid-template-rows:minmax(0,46%) minmax(0,54%);gap:10px}
  .visual{order:-1;border-radius:20px}
  .info{border-radius:20px;padding:16px}
  .info h1{font-size:24px}
  .topbar{height:56px}.brand small,.icon-btn .lbl,#hint,#secname{display:none}
  #nav{bottom:8px;padding:6px}.dot{min-width:16px;padding:0 3px}.dot span{width:6px;height:6px}.dot.cur span{width:16px}
  #notes{top:60px;bottom:74px}
  .stat{padding:6px 9px;min-width:60px}.stat .v{font-size:15px}.stat .k{font-size:9px;letter-spacing:.5px}.chartbox{height:96px!important;width:55%!important}.homes{display:none}.hud{gap:5px}.hud.tl,.hud.tr{top:8px}.hud.tr{right:8px;left:8px}.cap{font-size:11px;left:10px;bottom:10px}
}
@media (max-height:620px){.scene{padding-top:60px;padding-bottom:72px}.info{gap:9px}.info h1{font-size:24px}}
</style>
</head>
<body>
<canvas id="bg"></canvas>
<div id="app">
  <div id="progress"></div>
  <header class="topbar">
    <div class="brand"><div class="logo"></div><div>Свет → Электричество <small>· физика СЭС</small></div></div>

/* =====================================================================

SCENES.push({
  title: 'Заключение',
  notes: `<p><b>Заключение.</b> Работа солнечного фотоэлемента начинается со взаимодействия фотонов с электронами кремния.</p><p>Поглощённый фотон может перевести электрон из валентной зоны в зону проводимости, оставив дырку. Внутреннее электрическое поле p-n-перехода помогает разделять носители, а контакты — собирать их. При подключении нагрузки возникает электрический ток.</p><p>Источником электрической энергии является <b>солнечный свет</b>. Полупроводник не создаёт энергию, а обеспечивает её преобразование. При этом часть энергии теряется: на <b>отражение</b>, <b>неподходящую энергию фотонов</b>, <b>термализацию</b>, <b>рекомбинацию</b> и <b>сопротивление</b>.</p><p>Поэтому преобразование солнечной энергии — это совокупность нескольких эффектов: <b>внутреннего фотоэффекта</b> и работы <b>p-n-перехода</b>. Вот как-то так. Спасибо за внимание!</p>`,

  init() {

    this.bld = []; let x = 0; while (x < 1) { const bw = rnd(.035, .07); this.bld.push({ x, w: bw, h: rnd(.18, .5), seed: Math.random() * 1e4 }); x += bw + rnd(.004, .012); }

  },
  enter() { this.cv.resize(); this.T = 0; }, leave() { },
  update(dt, t) {
    const cv = this.cv; if (cv.w < 2) cv.resize(); const { ctx, w, h } = cv; cv.clear(); this.T += dt; const T = this.T;
    const sky = ctx.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, '#060a1e'); sky.addColorStop(.7, '#1a1440'); sky.addColorStop(1, '#2a1630'); ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);
    const sx = w * .12, sy = h * .18; glow(ctx, sx, sy, 150, C.sun, .55 + .1 * Math.sin(t * 2)); ctx.fillStyle = '#ffe6a8'; ctx.beginPath(); ctx.arc(sx, sy, 34, 0, TAU); ctx.fill();
    const px = w * .2, py = h * .74; ctx.save(); ctx.translate(px, py); ctx.transform(1, 0, -.5, .55, 0, 0); const pg = ctx.createLinearGradient(-90, -60, 90, 60); pg.addColorStop(0, '#2a62d6'); pg.addColorStop(1, '#0b2a6b'); ctx.fillStyle = pg; ctx.fillRect(-90, -70, 180, 140); ctx.strokeStyle = 'rgba(220,230,255,.4)'; ctx.lineWidth = 1.5; for (let i = -60; i <= 60; i += 30) { ctx.beginPath(); ctx.moveTo(i, -70); ctx.lineTo(i, 70); ctx.stroke(); } for (let j = -35; j <= 35; j += 35) { ctx.beginPath(); ctx.moveTo(-90, j); ctx.lineTo(90, j); ctx.stroke(); } ctx.restore();

    if (T > 3.4 && !this.dinged) { this.dinged = 1; Snd.ding(.75); } if (T < 1) this.dinged = 0;
  }
});

<script>
/* =====================================================================
   ПРИЛОЖЕНИЕ: навигация, переходы, режим докладчика, главный цикл
   ===================================================================== */
let cur = 0, prevI = -1, notesOpen = false; const running = new Set();
function buildNav() {
  const d = $('#dots'); SCENES.forEach((s, i) => { const b = el('div', 'dot', `<span></span><em>${i + 1}. ${s.title}</em>`); b.onclick = () => go(i); d.appendChild(b); });
}
function go(i, silent) {
  i = clamp(i, 0, SCENES.length - 1); if (i === cur && prevI !== -1) return;
  const dir = i > cur ? 1 : -1; const old = SCENES[cur], nw = SCENES[i];
  if (prevI !== -1 && old !== nw) {
    old.root.classList.remove('active', 'from-left', 'from-right'); old.root.classList.add(dir > 0 ? 'to-left' : 'to-right'); old.leave && old.leave();
    const o = old; setTimeout(() => { if (SCENES[cur] !== o) { running.delete(o); o.root.classList.remove('to-left', 'to-right'); } }, 1000);
  }
  nw.root.classList.remove('to-left', 'to-right', 'active'); nw.root.classList.add(dir > 0 ? 'from-right' : 'from-left'); void nw.root.offsetWidth;
  requestAnimationFrame(() => { nw.root.classList.remove('from-left', 'from-right'); nw.root.classList.add('active'); });
  cur = i; prevI = i; running.add(nw); RESIZERS.forEach(f => f()); nw.enter && nw.enter();
  const hs = nw.root.querySelectorAll('.hud .stat'); if (window.gsap && hs.length) gsap.fromTo(hs, { y: -14, opacity: 0 }, { y: 0, opacity: 1, duration: .8, stagger: .06, delay: .35, ease: 'power3.out' });
  BG.tpx = i / (SCENES.length - 1) * 4;
  if (!silent) Snd.whoosh();
  [...$('#dots').children].forEach((d, k) => { d.classList.toggle('cur', k === i); d.classList.toggle('done', k < i); });
  $('#counter').innerHTML = `<b>${i + 1}</b> / ${SCENES.length}`; $('#secname').textContent = nw.title; $('#progress').style.width = ((i + 1) / SCENES.length * 100) + '%';
  $('#notesTxt').innerHTML = nw.notes; $('#notesN').textContent = `${i + 1} / ${SCENES.length}`; $('#notesFix').textContent = nw.fix ? '✎ ' + nw.fix : '';
  history.replaceState(null, '', '#' + (i + 1)); if (Speech.on) Speech.say();
}
function toggleNotes() { notesOpen = !notesOpen; $('#notes').classList.toggle('open', notesOpen); $('#bNotes').classList.toggle('on', notesOpen); }
function toggleFull() { const d = document; if (!d.fullscreenElement && !d.webkitFullscreenElement) { const e = d.documentElement; const pr = (e.requestFullscreen || e.webkitRequestFullscreen).call(e); pr && pr.catch && pr.catch(() => { }); } else (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
window.addEventListener('keydown', e => {
  if (e.altKey || e.ctrlKey || e.metaKey) return; const k = e.key;
  if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); go(cur + 1); }
  else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); go(cur - 1); }
  else if (k === 'Home') go(0); else if (k === 'End') go(SCENES.length - 1);
  else if (k === 'n' || k === 'N' || k === 'т' || k === 'Т') toggleNotes();
  else if (k === 'f' || k === 'F' || k === 'а' || k === 'А') toggleFull();
  else if (k === 'm' || k === 'M' || k === 'ь' || k === 'Ь') Snd.toggle();
  else if (/^[1-9]$/.test(k)) go(+k - 1);
});
// свайпы (кроме контролов и 3D-сцен с вращением)
let tx0 = null, ty0 = 0;
window.addEventListener('touchstart', e => { if (e.target.closest('[data-noswipe],.drag,.info,#notes')) { tx0 = null; return; } tx0 = e.touches[0].clientX; ty0 = e.touches[0].clientY; }, { passive: true });
window.addEventListener('touchend', e => { if (tx0 == null) return; const dx = e.changedTouches[0].clientX - tx0, dy = e.changedTouches[0].clientY - ty0; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) go(cur + (dx < 0 ? 1 : -1)); tx0 = null; }, { passive: true });
$('#prev').onclick = () => go(cur - 1); $('#next').onclick = () => go(cur + 1);
$('#bNotes').onclick = toggleNotes; $('#bFull').onclick = toggleFull; $('#bMute').onclick = () => Snd.toggle(); $('#bSpeak').onclick = () => Speech.toggle();

// запуск
BG.init();
SCENES.forEach(s => { try { s.init(); } catch (err) { console.error('Ошибка инициализации сцены', s.title, err); } });
buildNav();
const start = clamp((parseInt(location.hash.slice(1)) || 1) - 1, 0, SCENES.length - 1); cur = start; go(start, true);
if (!HAS3D) setTimeout(() => toast('WebGL/Three.js недоступен — включён режим Canvas 2D'), 800);
let last = performance.now();
function loop(now) {
  const dt = Math.min(.1, (now - last) / 1000); last = now; const t = now / 1000;
  BG.update(dt, t); tickCounters(dt);
  for (const s of running) { try { s.update(dt, t); } catch (err) { if (!s._err) { console.error(s.title, err); s._err = 1; } } }
  requestAnimationFrame(loop);

requestAnimationFrame(loop);
</script>
