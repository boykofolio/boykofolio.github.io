<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Candy Break</title>
<style>html,body{margin:0;height:100%;background:#ffd9ec;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}canvas{width:100%;height:100%;display:block}</style></head><body><canvas id="c"></canvas><script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),VW=600,VH=900,FONT='ui-rounded,"SF Pro Rounded",system-ui,-apple-system,sans-serif';
const COL=['#ff5c8a','#ff9447','#ffcf3d','#45d483','#3fa7ff','#a77bff'];
const mk=(w,h)=>{const k=document.createElement('canvas');k.width=w;k.height=h;return[k,k.getContext('2d')]};
function blob(col){const[k,g]=mk(256,256),gr=g.createRadialGradient(128,128,0,128,128,128);gr.addColorStop(0,col);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,256,256);return k}
const BL=['rgba(255,140,200,.8)','rgba(140,200,255,.8)','rgba(255,230,140,.8)','rgba(190,150,255,.7)'].map(blob);
let W,H,D,k,ox,oy,BG;
function rs(){D=Math.min(devicePixelRatio||1,2);W=c.width=innerWidth*D;H=c.height=innerHeight*D;k=Math.min(W/VW,H/VH);ox=(W-VW*k)/2;oy=(H-VH*k)/2;
let g;[BG,g]=mk(W,H);const gr=g.createLinearGradient(0,0,W,H);gr.addColorStop(0,'#ffe3f1');gr.addColorStop(.5,'#ffd2e6');gr.addColorStop(1,'#d6e8ff');g.fillStyle=gr;g.fillRect(0,0,W,H)}
addEventListener('resize',rs);rs();
let state='start',t=0,score=0,lives=3,level=1,best=+localStorage.getItem('candyBest')||0,bricks=[],ball,pad={x:300,w:120,sq:0},target=300,P=[],trail=[],banner=0,shake=0,keys={};
function build(){bricks=[];const rows=Math.min(9,4+level),cw=64,gap=6,x0=(VW-(8*cw+7*gap))/2;
for(let r=0;r<rows;r++)for(let i=0;i<8;i++){if(level>2&&Math.random()<.08)continue;const hp=Math.random()<Math.min(.5,.1*level)?2:1;bricks.push({x:x0+i*(cw+gap),y:130+r*34,w:cw,h:26,c:COL[r%6],hp,f:0})}}
function stick(){ball={x:pad.x,y:812,vx:0,vy:0,r:11,s:430+level*35,stuck:true};trail=[]}
function reset(play){score=0;lives=3;level=1;build();stick();state=play?'play':'start';banner=play?1.5:0}
function launch(){if(!ball.stuck)return;const a=(Math.random()-.5)*.8;ball.vx=Math.sin(a)*ball.s;ball.vy=-Math.cos(a)*ball.s;ball.stuck=false}
function act(){if(state=='start'||state=='over'){reset(true);return}launch()}
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='Space'||e.code=='Enter'){e.preventDefault();act()}});addEventListener('keyup',e=>keys[e.code]=0);
const vx=e=>(e.clientX*D-ox)/k;addEventListener('pointerdown',e=>{target=vx(e);act()});addEventListener('pointermove',e=>target=vx(e));
function burst(X,Y,n,col){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=60+Math.random()*260;P.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-120,r:Math.random()*6,w:Math.random()*10-5,l:1,c:col,s:4+Math.random()*6})}}
function rr(X,Y,w,h,r,col){x.fillStyle=col;x.beginPath();x.roundRect(X,Y,w,h,r);x.fill()}
function txt(s,X,Y,size,fill,al='center',w=900){x.font=`${w} ${size}px ${FONT}`;x.textAlign=al;x.fillStyle=fill;x.fillText(s,X,Y)}
function physics(dt){const b=ball;if(b.stuck){b.x=pad.x;b.y=812;return}
const n=Math.ceil(b.s*dt/6);for(let s=0;s<n;s++){b.x+=b.vx*dt/n;b.y+=b.vy*dt/n;
if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)}if(b.x>VW-b.r){b.x=VW-b.r;b.vx=-Math.abs(b.vx)}if(b.y<80+b.r){b.y=80+b.r;b.vy=Math.abs(b.vy)}
if(b.vy>0&&b.y+b.r>=830&&b.y<850&&Math.abs(b.x-pad.x)<pad.w/2+b.r){const a=(b.x-pad.x)/(pad.w/2)*1.05;b.vx=Math.sin(a)*b.s;b.vy=-Math.cos(a)*b.s;b.y=830-b.r;pad.sq=1}
for(const q of bricks){const cx=Math.max(q.x,Math.min(b.x,q.x+q.w)),cy=Math.max(q.y,Math.min(b.y,q.y+q.h)),dx=b.x-cx,dy=b.y-cy;if(dx*dx+dy*dy>b.r*b.r)continue;
const ox2=Math.min(b.x+b.r-q.x,q.x+q.w-b.x+b.r),oy2=Math.min(b.y+b.r-q.y,q.y+q.h-b.y+b.r);if(ox2<oy2){b.vx=b.x<q.x+q.w/2?-Math.abs(b.vx):Math.abs(b.vx)}else{b.vy=b.y<q.y+q.h/2?-Math.abs(b.vy):Math.abs(b.vy)}
q.f=1;if(--q.hp<=0){q.dead=1;score+=10*level;burst(q.x+q.w/2,q.y+q.h/2,14,q.c);shake=.15}else score+=2;break}
bricks=bricks.filter(q=>!q.dead)}
if(b.y>VH+30){if(state=='start'){stick();return}if(--lives<=0){state='over';if(score>best){best=score;localStorage.setItem('candyBest',best)}}else stick();shake=.4}
if(!bricks.length){if(state=='play'){level++;banner=1.5}build();stick()}}
let last=0;function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;t+=dt;banner=Math.max(0,banner-dt);shake=Math.max(0,shake-dt);
const kk=(keys.ArrowLeft||keys.KeyA?-1:0)+(keys.ArrowRight||keys.KeyD?1:0);if(kk)target=pad.x+kk*40;
if(state=='start'){target=ball.x+Math.sin(t*1.3)*30;if(ball.stuck&&t%2>1)launch()}
target=Math.max(pad.w/2,Math.min(VW-pad.w/2,target));pad.x+=(target-pad.x)*Math.min(1,dt*18);pad.sq=Math.max(0,pad.sq-dt*4);
if(state!='over')physics(dt);trail.unshift({x:ball.x,y:ball.y});trail.length=Math.min(trail.length,10);
x.setTransform(1,0,0,1,0,0);x.drawImage(BG,0,0);
BL.forEach((b,i)=>{const s=Math.max(W,H)*.7,X=W*(.5+Math.sin(t*.3+i*1.7)*.45)-s/2,Y=H*(.5+Math.cos(t*.25+i*2.3)*.45)-s/2;x.drawImage(b,X,Y,s,s)});
const sh=shake?(Math.random()-.5)*16*shake:0;x.setTransform(k,0,0,k,ox+sh*k,oy+sh*k);
rr(10,70,VW-20,VH-80,28,'rgba(255,255,255,.38)');x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=3;x.stroke();
for(const q of bricks){q.f=Math.max(0,q.f-dt*5);const lift=q.f*4;rr(q.x,q.y+5,q.w,q.h,10,'rgba(150,50,110,.22)');rr(q.x,q.y-lift,q.w,q.h,10,q.f?'#fff':q.c);
rr(q.x+5,q.y+3-lift,q.w-10,q.h*.38,6,'rgba(255,255,255,.45)');if(q.hp>1){x.strokeStyle='rgba(255,255,255,.95)';x.lineWidth=3;x.beginPath();x.roundRect(q.x+4,q.y+4-lift,q.w-8,q.h-8,6);x.stroke()}}
trail.forEach((p,i)=>{x.globalAlpha=(1-i/10)*.35;x.fillStyle=COL[(i+(t*10|0))%6];x.beginPath();x.arc(p.x,p.y,ball.r*(1-i/12),0,7);x.fill()});x.globalAlpha=1;
x.fillStyle='rgba(150,50,110,.2)';x.beginPath();x.ellipse(ball.x+4,ball.y+6,ball.r,ball.r,0,0,7);x.fill();
x.fillStyle='#fff';x.beginPath();x.arc(ball.x,ball.y,ball.r,0,7);x.fill();x.lineWidth=4;x.strokeStyle='#ff5c8a';x.stroke();
const pw=pad.w*(1+pad.sq*.15),ph=20*(1-pad.sq*.25);rr(pad.x-pw/2,834+6,pw,ph,ph/2,'rgba(150,50,110,.22)');
const pg=x.createLinearGradient(pad.x-pw/2,0,pad.x+pw/2,0);pg.addColorStop(0,'#ff5c8a');pg.addColorStop(.5,'#ff9bd0');pg.addColorStop(1,'#a77bff');rr(pad.x-pw/2,832,pw,ph,ph/2,pg);rr(pad.x-pw/2+10,834,pw-20,5,3,'rgba(255,255,255,.6)');
P=P.filter(p=>(p.l-=dt*1.2)>0);P.forEach(p=>{p.vy+=700*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.w*dt;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.globalAlpha=Math.min(1,p.l*2);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});x.globalAlpha=1;
txt(score,30,55,40,'#7a2a6a','left');txt('LV '+level,VW/2,52,26,'#b04a90');txt('♥'.repeat(Math.max(0,lives)),VW-30,52,30,'#ff5c8a','right');
if(banner&&state=='play'){x.globalAlpha=Math.min(1,banner*2);txt('УРОВЕНЬ '+level,VW/2,560,56,'#7a2a6a');x.globalAlpha=1}
if(state=='play'&&ball.stuck&&!banner)txt('нажми, чтобы запустить',VW/2,760,22,'rgba(122,42,106,.7)',undefined,700);
if(state!='play'){rr(0,0,VW,VH,0,'rgba(255,235,245,.55)');
if(state=='start'){'CANDY'.split('').forEach((ch,i)=>txt(ch,VW/2+(i-2)*78,380+Math.sin(t*3+i)*10,110,COL[i]));txt('BREAK',VW/2,490,96,'#7a2a6a')}
else{txt('GAME OVER',VW/2,400,76,'#ff5c8a');txt(score+(score>=best&&score?'  ★ рекорд':''),VW/2,470,40,'#7a2a6a')}
if((t*2|0)%2==0)txt(state=='start'?'НАЖМИ, ЧТОБЫ ИГРАТЬ':'НАЖМИ, ЧТОБЫ СНОВА',VW/2,580,28,'#b04a90',undefined,800);
txt('мышь / палец / ← →  ·  лучший: '+best,VW/2,625,20,'rgba(122,42,106,.65)',undefined,600)}
requestAnimationFrame(loop)}reset(false);requestAnimationFrame(loop)})();
</script></body></html>
