<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1a0f33">
<title>Dusk Runner</title>
<style>
  html,body{margin:0;height:100%;background:#120a24;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:pointer}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; const x = c.getContext('2d'); x.imageSmoothingEnabled = false; return [c, x]; };
const OUT = '#1b0f2e';

// ---------- seeded rng ----------
let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;

// ---------- sprite builder: char grid -> canvas with auto 1px outline ----------
function sprite(rows, pal) {
  const h = rows.length, w = rows[0].length;
  const [c, x] = mk(w + 2, h + 2);
  x.fillStyle = OUT;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (rows[j][i] !== '.') {
    x.fillRect(i, j + 1, 1, 1); x.fillRect(i + 2, j + 1, 1, 1); x.fillRect(i + 1, j, 1, 1); x.fillRect(i + 1, j + 2, 1, 1);
  }
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const ch = rows[j][i]; if (ch !== '.') { x.fillStyle = pal[ch]; x.fillRect(i + 1, j + 1, 1, 1); } }
  return c;
}

// ---------- hero: coral dino with a teal scarf ----------
const DP = { g: '#ff7d6b', d: '#b8435a', b: '#ffd59e', s: '#33e0c0', t: '#1f9e93', w: '#fff6e8', k: '#1b0f2e' };
const head = ["..........ggggg.", ".........ggggggg", ".........gggwkgg", ".........ggggggg", ".........ggggddd", ".........ggggg.."];
const deadHead = ["..........ggggg.", ".........gggkgkg", ".........ggggkgg", ".........gggkgkg", ".........ggggddd", ".........ggggg.."];
const scarfA = ["ss......sssss...", ".tss...ssssssg.."];
const scarfB = [".s......sssss...", "sts.s..ssssssg.."];
const body = ["g..ssssggggbbgg.", "gg..gggggggbb.g.", "ggggggggggbbb...", ".dgggggggdbbb...", "..ddggggggbb....", "...dddgggg......"];
const legs = {
  r1: ["....gg...gg.....", "....gg....gg....", "....ggg........."],
  r2: ["....gg...gg.....", "...gg....gg.....", ".........ggg...."],
  j:  ["...ggg..ggg.....", "................", "................"]
};
const DINO = {
  run1: sprite([...head, ...scarfA, ...body, ...legs.r1], DP),
  run2: sprite([...head, ...scarfB, ...body, ...legs.r2], DP),
  jump: sprite([...head, ...scarfB, ...body, ...legs.j], DP),
  dead: sprite([...deadHead, ...scarfA, ...body, ...legs.r1], DP)
};

// ---------- obstacles ----------
const CP = { c: '#27b38f', h: '#8af5cf', d: '#16705f', p: '#ff5fa2' };
function cactus(h, armL, armR) {
  const w = 12, g = Array.from({ length: h }, () => Array(w).fill('.'));
  for (let y = 1; y < h; y++) { g[y][4] = 'c'; g[y][5] = 'h'; g[y][6] = 'c'; g[y][7] = 'd'; }
  g[0][5] = 'p'; g[0][6] = 'p';
  if (armL) { const a = armL; g[a][1] = g[a][2] = g[a][3] = 'c'; g[a + 1][2] = g[a + 1][3] = 'd'; for (let y = a - 5; y < a; y++) { g[y][1] = 'h'; g[y][2] = 'c'; } g[a - 6][1] = 'p'; }
  if (armR) { const a = armR; g[a][8] = g[a][9] = g[a][10] = 'c'; g[a + 1][8] = g[a + 1][9] = 'd'; for (let y = a - 4; y < a; y++) { g[y][9] = 'h'; g[y][10] = 'd'; } g[a - 5][10] = 'p'; }
  return sprite(g.map(r => r.join('')), CP);
}
const CACTI = [cactus(14, 0, 8), cactus(16, 9, 0), cactus(22, 12, 9), cactus(24, 10, 14), cactus(12, 0, 0)];
const MP = { w: '#8f8cff', b: '#4b3fb8', e: '#ffe36b', l: '#cfc9ff' };
const MOTH = [
  sprite(["..l......l..", ".ww......ww.", "www..bb..www", ".wwwbbbbwww.", "....ebbb....", "....bbbb....", ".....bb....."], MP),
  sprite(["............", "............", "....bb......", "wwwbbbbbbwww", ".wwwebbbwww.", "..ww.bb.ww..", "..l......l.."], MP)
];

// ---------- bitmap font 3x5 ----------
const F = {
  '0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001111001111','4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001010010','8':'111101111101111','9':'111101111001111',
  A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',M:'101111111101101',N:'110101101101101',O:'010101101101010',P:'110101110100100',R:'110101110101101',S:'011100010001110',T:'111010010010010',U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',Y:'101101010010010',
  '/':'001001010100100','-':'000000111000000','!':'010010010000010',':':'000010000010000','.':'000000000000010',' ':'000000000000000'
};
const glyphs = new Map();
function glyph(ch, col) {
  const k = ch + col; let g = glyphs.get(k); if (g) return g;
  const [c, x] = mk(3, 5); x.fillStyle = col; const b = F[ch] || F[' '];
  for (let i = 0; i < 15; i++) if (b[i] === '1') x.fillRect(i % 3, (i / 3) | 0, 1, 1);
  glyphs.set(k, c); return c;
}
function text(str, X, Y, s, col, align = 'l', shadow = OUT) {
  const w = (str.length * 4 - 1) * s;
  let x0 = Math.round(align === 'c' ? X - w / 2 : align === 'r' ? X - w : X); Y = Math.round(Y);
  for (let p = 0; p < 2; p++) {
    const c = p ? col : shadow, o = p ? 0 : Math.max(1, s >> 1);
    if (!c) continue;
    for (let i = 0; i < str.length; i++) ctx.drawImage(glyph(str[i], c), x0 + i * 4 * s + o, Y + o, 3 * s, 5 * s);
  }
}

// ---------- world layers (prerendered tiles) ----------
function range(w, h, fn, col, rim, seedV) {
  seed = seedV; const [c, x] = mk(w, h);
  const ph = [rnd() * 6.28, rnd() * 6.28, rnd() * 6.28, rnd() * 6.28];
  for (let i = 0; i < w; i++) {
    const top = Math.max(0, Math.min(h - 1, Math.round(fn(i / w * Math.PI * 2, ph, i))));
    x.fillStyle = col; x.fillRect(i, top, 1, h - top);
    if (rim) { x.fillStyle = rim; x.fillRect(i, top, 1, 1); }
  }
  return c;
}
const FAR = range(384, 90, (t, p) => 40 - 18 * Math.sin(t * 2 + p[0]) - 10 * Math.sin(t * 5 + p[1]) - 4 * Math.sin(t * 11 + p[2]), '#5a2a74', '#a8508a', 3);
const MID = range(320, 70, (t, p) => { const v = 34 - 14 * Math.sin(t * 3 + p[0]) - 9 * Math.sin(t * 7 + p[1]); return Math.floor(v / 9) * 9 + 4; }, '#3a1752', '#ff8a6a', 11);
const NEAR = (() => {
  const c = range(256, 40, (t, p) => 30 - 4 * Math.sin(t * 2 + p[0]) - 3 * Math.sin(t * 5 + p[1]), '#24103a', '#5c2a5e', 19);
  const x = c.getContext('2d'); x.fillStyle = '#24103a'; seed = 23;
  for (let k = 0; k < 6; k++) { // little silhouette cacti
    const cx = (rnd() * 240 + 8) | 0, ch = 8 + (rnd() * 10) | 0, b = 24;
    x.fillRect(cx, b - ch, 3, ch + 6); x.fillRect(cx - 3, b - ch + 4, 3, 2); x.fillRect(cx - 3, b - ch + 1, 2, 4); x.fillRect(cx + 3, b - ch + 6, 3, 2); x.fillRect(cx + 4, b - ch + 3, 2, 4);
  }
  return c;
})();
function cloud(w, seedV) {
  seed = seedV; const h = 12; const [c, x] = mk(w, h);
  const puffs = []; for (let i = 0; i < 5; i++) puffs.push([4 + rnd() * (w - 8), 6 + rnd() * 3, 3 + rnd() * 4]);
  for (const [col, dy] of [['#c86a9a', 1], ['#ffb3a1', 0]])
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
      let inside = j < 10 && puffs.some(([px, py, r]) => (i - px) ** 2 + ((j - py) * 1.6) ** 2 < r * r * 2.2);
      if (inside) { x.fillStyle = col; x.fillRect(i, j + dy, 1, 1); }
    }
  return c;
}
const CLOUDS = [cloud(34, 5), cloud(24, 9), cloud(44, 13)];
const SUN = (() => {
  const r = 26, [c, x] = mk(r * 2, r * 2);
  for (let j = 0; j < r * 2; j++) {
    const t = j / (r * 2), dy = j - r + 0.5;
    if (j > r * 0.9 && ((j - r) % 6) < Math.min(4, 1 + ((j - r * 0.9) / 5) | 0)) continue; // synth stripes
    const half = Math.sqrt(Math.max(0, r * r - dy * dy));
    x.fillStyle = t < 0.3 ? '#fff1a8' : t < 0.5 ? '#ffd27a' : t < 0.7 ? '#ffa06a' : '#ff6f7a';
    x.fillRect(Math.round(r - half), j, Math.round(half * 2), 1);
  }
  return c;
})();
const MOON = sprite(["..wwww..", ".wwwwww.", "wwwdwwww", "wwwwwwdw", "wdwwwwww", "wwwwwwww", ".wwwdww.", "..wwww.."], { w: '#f2ecff', d: '#c7bde8' });

let W = 320, H = 180, S = 1, GY = 150, SKY_D, SKY_N, GROUND, stars = [];
function bandSky(stops, h) {
  const [c, x] = mk(1, h), bands = 14;
  for (let j = 0; j < h; j++) {
    const t = Math.floor(j / h * bands) / (bands - 1);
    const k = Math.min(stops.length - 2, Math.floor(t * (stops.length - 1))), f = t * (stops.length - 1) - k;
    const a = stops[k], b = stops[k + 1];
    x.fillStyle = `rgb(${a.map((v, i) => Math.round(v + (b[i] - v) * f)).join(',')})`; x.fillRect(0, j, 1, 1);
  }
  return c;
}
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3), vw = innerWidth, vh = innerHeight;
  S = Math.max(1, Math.round(Math.min(vh * dpr / 180, vw * dpr / 250)));
  W = Math.ceil(vw * dpr / S); H = Math.ceil(vh * dpr / S);
  cv.width = W; cv.height = H; cv.style.width = W * S / dpr + 'px'; cv.style.height = H * S / dpr + 'px';
  ctx.imageSmoothingEnabled = false;
  GY = H - Math.max(30, Math.round(H * 0.2));
  SKY_D = bandSky([[34, 18, 68], [92, 34, 110], [196, 64, 120], [255, 128, 96], [255, 196, 120]], GY);
  SKY_N = bandSky([[8, 6, 26], [18, 14, 54], [38, 26, 92], [72, 40, 120], [120, 60, 130]], GY);
  const gh = H - GY; let x; [GROUND, x] = mk(64, gh);
  x.fillStyle = '#2a1236'; x.fillRect(0, 0, 64, gh);
  x.fillStyle = '#ffb07a'; x.fillRect(0, 0, 64, 1);
  x.fillStyle = '#c45a6a'; x.fillRect(0, 1, 64, 1);
  x.fillStyle = '#5e2650'; x.fillRect(0, 2, 64, 2);
  seed = 31;
  for (let i = 0; i < 40; i++) { const y = 5 + (rnd() * (gh - 5)) | 0; x.fillStyle = rnd() < 0.5 ? '#3d1a48' : '#1d0c2a'; x.fillRect((rnd() * 64) | 0, y, 1 + (rnd() * 3 | 0), 1); }
  for (let i = 0; i < 6; i++) { x.fillStyle = '#7a3560'; x.fillRect((rnd() * 62) | 0, 4 + (rnd() * 4 | 0), 2, 1); }
  seed = 99; stars = [];
  for (let i = 0; i < Math.round(W * GY / 700); i++) stars.push([(rnd() * W) | 0, (rnd() * GY * 0.75) | 0, rnd() * 6.28, rnd() < 0.15]);
}
addEventListener('resize', resize); resize();

// ---------- particles (pooled) ----------
const P = Array.from({ length: 160 }, () => ({ on: false }));
function puff(x, y, n, spread, up, cols, life = 0.5) {
  for (let i = 0, k = 0; i < P.length && k < n; i++) if (!P[i].on) {
    const p = P[i]; k++;
    p.on = true; p.x = x + (Math.random() - 0.5) * 4; p.y = y; p.vx = (Math.random() - 0.5) * spread - 30; p.vy = -Math.random() * up;
    p.life = p.max = life * (0.6 + Math.random() * 0.6); p.c = cols[(Math.random() * cols.length) | 0]; p.s = Math.random() < 0.3 ? 2 : 1;
  }
}
const DUST = ['#ffb07a', '#e07a7a', '#a8508a'];

// ---------- game state ----------
const HI_KEY = 'duskRunnerHi';
let hi = +(localStorage.getItem(HI_KEY) || 0);
let state = 'title', t = 0, cam = 0, speed = 60, score = 0, stateT = 0, flash = 0, shake = 0, newBest = false, milestone = 0;
const dino = { x: 28, y: 0, vy: 0, ground: true, anim: 0, stepT: 0, held: false, buf: 0, coyote: 0 };
let obs = [], nextGap = 200;

function reset() {
  obs = []; nextGap = 160; score = 0; speed = 115; dino.y = 0; dino.vy = 0; dino.ground = true; newBest = false; milestone = 0;
  state = 'play'; stateT = 0;
}
function press() {
  if (state === 'title') { reset(); dino.buf = 0.12; return; }
  if (state === 'over') { if (stateT > 0.45) reset(); return; }
  dino.buf = 0.12; dino.held = true;
}
function release() { dino.held = false; if (dino.vy < -110) dino.vy = -110; }
addEventListener('keydown', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') { e.preventDefault(); if (!e.repeat) press(); } });
addEventListener('keyup', e => { if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') release(); });
addEventListener('pointerdown', e => { e.preventDefault(); press(); });
addEventListener('pointerup', release); addEventListener('pointercancel', release);

function spawn() {
  const x = W + 20;
  if (score > 250 && Math.random() < 0.22) {
    const high = Math.random() < 0.5;
    obs.push({ k: 'm', x, y: high ? 34 : 9, w: 14, h: 9, f: 0 });
  } else {
    const n = score < 120 ? 1 : 1 + (Math.random() < 0.35) + (score > 500 && Math.random() < 0.25);
    const list = []; let w = 0;
    for (let i = 0; i < n; i++) { const s = CACTI[(Math.random() * (score < 80 ? 2 : CACTI.length)) | 0]; list.push([s, w]); w += s.width - 4; }
    obs.push({ k: 'c', x, list, w: w + 4, h: Math.max(...list.map(l => l[0].height)) });
  }
  nextGap = speed * (0.75 + Math.random() * 0.7) + 70;
}
const hit = (ax, ay, aw, ah, bx, by, bw, bh) => ax < bx + bw && ax + aw > bx && ay < by + bh && ay + ah > by;

function die() {
  state = 'over'; stateT = 0; flash = 1; shake = 0.35;
  puff(dino.x + 10, GY - dino.y - 10, 26, 160, 160, ['#ff7d6b', '#33e0c0', '#ffd59e', '#fff6e8'], 0.8);
  if (score > hi) { hi = Math.floor(score); newBest = true; try { localStorage.setItem(HI_KEY, hi); } catch (e) {} }
}

function update(dt) {
  t += dt; stateT += dt; flash = Math.max(0, flash - dt * 3); shake = Math.max(0, shake - dt);
  const playing = state === 'play';
  const sp = playing ? speed : state === 'title' ? 55 : speed * Math.max(0, 1 - stateT * 2.5);
  cam += sp * dt;
  if (playing) {
    speed = Math.min(270, speed + dt * 3.2);
    score += sp * dt * 0.1;
    const m = Math.floor(score / 100); if (m > milestone) { milestone = m; flash = 0.25; }
    // jump physics
    dino.buf -= dt; dino.coyote = dino.ground ? 0.08 : dino.coyote - dt;
    if (dino.buf > 0 && dino.coyote > 0) {
      dino.vy = -310; dino.ground = false; dino.buf = 0; dino.coyote = 0;
      puff(dino.x + 6, GY, 7, 70, 40, DUST, 0.45);
      if (!dino.held) dino.vy = -230;
    }
    if (!dino.ground) {
      dino.vy += (dino.vy < 0 && dino.held ? 860 : 1250) * dt;
      dino.y -= dino.vy * dt;
      if (dino.y <= 0) { dino.y = 0; dino.vy = 0; dino.ground = true; puff(dino.x + 8, GY, 11, 120, 55, DUST, 0.55); }
    }
    // obstacles
    nextGap -= sp * dt; if (nextGap <= 0) spawn();
    const dx = dino.x + 4, dy = GY - dino.y - 16, dw = 11, dh = 14;
    for (const o of obs) {
      o.x -= sp * dt * (o.k === 'm' ? 1.12 : 1);
      if (o.k === 'c') { if (hit(dx, dy, dw, dh, o.x + 4, GY - o.h + 3, o.w - 8, o.h)) { die(); break; } }
      else if (hit(dx, dy, dw, dh, o.x + 2, GY - o.y - o.h + 1, o.w - 4, o.h - 3)) { die(); break; }
    }
    obs = obs.filter(o => o.x > -60);
  } else {
    for (const o of obs) o.x -= sp * dt * (o.k === 'm' ? 1.12 : 1);
  }
  // footsteps
  if (dino.ground && state !== 'over') { dino.stepT -= dt; if (dino.stepT <= 0) { dino.stepT = 0.16; puff(dino.x + 5, GY, 1, 30, 18, DUST, 0.35); } }
  dino.anim += dt * (8 + sp / 30);
  for (const p of P) if (p.on) { p.life -= dt; if (p.life <= 0) { p.on = false; continue; } p.vy += 180 * dt; p.x += (p.vx - sp * 0.3) * dt; p.y += p.vy * dt; if (p.y > GY) { p.y = GY; p.vy *= -0.3; } }
}

function tile(img, speedK, y) {
  const w = img.width; let off = Math.round((cam * speedK) % w);
  for (let x = -off; x < W; x += w) ctx.drawImage(img, x, y);
}

function draw() {
  const night = 0.5 - 0.5 * Math.cos((score / 700) * Math.PI); // dusk -> night -> dusk
  const n = Math.max(0, Math.min(1, night));
  ctx.save();
  if (shake > 0) ctx.translate(Math.round((Math.random() - 0.5) * 6 * shake / 0.35), Math.round((Math.random() - 0.5) * 6 * shake / 0.35));
  // sky
  ctx.drawImage(SKY_D, 0, 0, W, GY);
  if (n > 0.01) { ctx.globalAlpha = n; ctx.drawImage(SKY_N, 0, 0, W, GY); ctx.globalAlpha = 1; }
  // stars
  const sa = 0.25 + n * 0.75;
  for (const [x, y, ph, big] of stars) {
    const tw = Math.sin(t * 2.2 + ph);
    ctx.globalAlpha = sa * (0.45 + 0.55 * Math.max(0, tw)) * (1 - y / GY * 0.6);
    ctx.fillStyle = big ? '#fff3c4' : '#e8dcff';
    const sx = ((x - cam * 0.01) % W + W) % W;
    ctx.fillRect(sx | 0, y, 1, 1);
    if (big && tw > 0.7) { ctx.fillRect((sx | 0) - 1, y, 3, 1); ctx.fillRect(sx | 0, y - 1, 1, 3); }
  }
  ctx.globalAlpha = 1;
  // sun & moon
  const sunY = Math.round(GY - 62 + n * 70);
  ctx.drawImage(SUN, Math.round(W * 0.68), sunY);
  ctx.drawImage(MOON, Math.round(W * 0.22), Math.round(GY * 0.18 + (1 - n) * GY * 0.9));
  // clouds
  ctx.globalAlpha = 0.9 - n * 0.5;
  for (let i = 0; i < 5; i++) {
    const c = CLOUDS[i % 3], span = W + 60, x = ((i * 137 - cam * (0.05 + i * 0.012)) % span + span) % span - 50;
    ctx.drawImage(c, Math.round(x), Math.round(GY * (0.12 + (i * 0.13) % 0.4)));
  }
  ctx.globalAlpha = 1;
  // parallax ranges
  tile(FAR, 0.08, GY - 78);
  tile(MID, 0.22, GY - 58);
  if (n > 0.01) { ctx.globalAlpha = n * 0.45; ctx.fillStyle = '#0a0828'; ctx.fillRect(0, 0, W, GY); ctx.globalAlpha = 1; }
  tile(NEAR, 0.5, GY - 30);
  tile(GROUND, 1, GY);
  // obstacles
  for (const o of obs) {
    if (o.k === 'c') for (const [s, ox] of o.list) ctx.drawImage(s, Math.round(o.x + ox), GY - s.height + 1);
    else ctx.drawImage(MOTH[(t * 8 | 0) % 2], Math.round(o.x), Math.round(GY - o.y - o.h - 1 + Math.sin(t * 6 + o.x * 0.05) * 1.5));
  }
  // hero
  const spr = state === 'over' ? DINO.dead : !dino.ground ? DINO.jump : ((dino.anim | 0) % 2 ? DINO.run1 : DINO.run2);
  const bob = dino.ground && state !== 'over' ? ((dino.anim | 0) % 2) : 0;
  ctx.fillStyle = 'rgba(20,6,30,0.45)';
  const shw = Math.max(4, 12 - dino.y * 0.12);
  ctx.fillRect(Math.round(dino.x + 9 - shw / 2), GY + 1, Math.round(shw), 1);
  ctx.drawImage(spr, Math.round(dino.x), Math.round(GY - dino.y - spr.height + 2 - bob));
  // particles
  for (const p of P) if (p.on) { ctx.globalAlpha = Math.min(1, p.life / p.max * 1.6); ctx.fillStyle = p.c; ctx.fillRect(p.x | 0, p.y | 0, p.s, p.s); }
  ctx.globalAlpha = 1;
  ctx.restore();
  // vignette bands (cheap)
  ctx.fillStyle = 'rgba(10,4,24,0.18)'; ctx.fillRect(0, 0, W, 2); ctx.fillRect(0, H - 2, W, 2);
  if (flash > 0) { ctx.globalAlpha = flash * 0.35; ctx.fillStyle = '#fff1d6'; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1; }
  // UI
  const pad = 8, sc = String(Math.floor(score)).padStart(5, '0');
  if (state !== 'title') {
    text(sc, W - pad, pad, 2, milestone && (t * 8 | 0) % 2 && flash > 0 ? '#ffffff' : '#ffe9c2', 'r');
    text('HI ' + String(hi).padStart(5, '0'), W - pad - sc.length * 8 - 8, pad + 3, 1, '#c9a3d9', 'r');
  }
  const cx = W / 2, cy = Math.min(GY * 0.42, GY - 70);
  const big = W >= 300 ? 4 : 3;
  if (state === 'title') {
    const fy = cy - 16 + Math.round(Math.sin(t * 2) * 2);
    text('DUSK', cx, fy - 6 * big - 4, big, '#ffd27a', 'c');
    text('RUNNER', cx, fy, big, '#ff7d6b', 'c');
    if ((t * 2 | 0) % 2 === 0) text('PRESS SPACE OR TAP', cx, fy + 6 * big + 10, 1, '#fff6e8', 'c');
    if (hi) text('BEST ' + hi, cx, fy + 6 * big + 22, 1, '#c9a3d9', 'c');
  } else if (state === 'over') {
    const k = Math.min(1, stateT * 4), oy = Math.round((1 - k) * -14);
    text('GAME OVER', cx, cy - 18 + oy, big - 1, '#ff7d6b', 'c');
    if (newBest && (t * 4 | 0) % 2 === 0) text('NEW BEST!', cx, cy + 2, 2, '#33e0c0', 'c');
    else if (!newBest) text('SCORE ' + Math.floor(score), cx, cy + 2, 2, '#ffe9c2', 'c');
    if (stateT > 0.45 && (t * 2 | 0) % 2 === 0) text('TAP TO RETRY', cx, cy + 20, 1, '#fff6e8', 'c');
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  update(dt); draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => { last = performance.now(); });
})();
</script>
</body>
</html>
